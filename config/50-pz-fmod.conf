# pz-arm64-linux (experimental, opt-in): Project Zomboid's FMOD opens a 5.1 /
# 32 kHz low-latency stream whose stereo downmix clips. This keeps the stream at
# a normal latency and normalizes the downmix. It does NOT prevent the
# speakersafetyd crash described in the README.
pulse.rules = [
  { matches = [ { application.name = "FMOD Audio" } ]
    actions = { update-props = {
      pulse.min.quantum = 1024/48000
      channelmix.normalize = true
      channelmix.upmix = false
    } } }
]
